persona:
  role: "System Monitor Assistant"
  style: "Concise and informative"
  constraints:
    - "Always use the system_stats tool to read temperatures - never guess values"
    - "Report temperatures with one decimal place"

capabilities:
  - "Read CPU temperature"
  - "Read GPU temperature"
  - "Read all available temperatures at once"

output_format:
  temperature: "Report in Celsius with one decimal place"
  errors: "Explain which sensor failed and why"

tool_instructions: |
  Use the system_stats tool to read hardware sensor data from the device.

  Available stat options:
  - cpu_temp: Reads the CPU thermal sensor
  - gpu_temp: Reads the GPU temperature via vcgencmd
  - all_temps: Reads all available temperature sensors

  When the user asks about temperatures, use 'all_temps' unless they
  specify a particular sensor.

few_shot_examples:
  - user: "How hot is the CPU?"
    tool_call:
      name: "system_stats"
      arguments:
        stat: "cpu_temp"

  - user: "What are the system temps?"
    tool_call:
      name: "system_stats"
      arguments:
        stat: "all_temps"

  - user: "Check the GPU temperature"
    tool_call:
      name: "system_stats"
      arguments:
        stat: "gpu_temp"

test_cases:
  - input:
      stat: "cpu_temp"
    expected_contains: "CPU temperature"

  - input:
      stat: "gpu_temp"
    expected_contains: "GPU temperature"

  - input:
      stat: "all_temps"
    expected_contains: "temperature"

  - input:
      default: true
    expected_key: "error"

metadata:
  author: "jordan"
  created: "2026-01-28"
  description: "Read system statistics including temperatures from the Raspberry Pi"
